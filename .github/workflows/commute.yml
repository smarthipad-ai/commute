name: commute
on:
  schedule:
    # Fallback only: GitHub's scheduler has been starting these 4-5 hours late. The real trigger is the external timer,
    # which calls tick.yml; commute.py decides from the actual time and a run outside a session just exits.
    - cron: "20 4 * * 1-5"
    - cron: "20 12 * * 1-5"
  workflow_dispatch:
    inputs:
      session:
        description: "Run the live session for the current morning/afternoon window instead of sending one ping"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: commute
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.name commute-bot
          git config --global user.email commute-bot@users.noreply.github.com
          python commute.py --watch
        env:
          RMV_KEY: ${{ secrets.RMV_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME_ADDR: ${{ secrets.HOME_ADDR }}
          WORK_ADDR: ${{ secrets.WORK_ADDR }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.session }}
