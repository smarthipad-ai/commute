name: commute
on:
  schedule:
    # Berlin is UTC+2 in summer, UTC+1 in winter. GitHub's scheduler is best-effort and often hours late, so there are several
    # triggers; commute.py decides from the actual time and an extra run simply finds no session to cover.
    - cron: "20 4 * * 1-5"    # morning session 07:00-09:00 (starts ~06:20 Berlin)
    - cron: "50 4 * * 1-5"
    - cron: "20 5 * * 1-5"
    - cron: "50 5 * * 1-5"
    - cron: "20 12 * * 1-5"   # afternoon session 15:00-17:30 (starts ~14:20 Berlin)
    - cron: "50 12 * * 1-5"
    - cron: "20 13 * * 1-5"
    - cron: "50 13 * * 1-5"
  workflow_dispatch:
    inputs:
      session:
        description: "Run the live session for the current morning/afternoon window instead of sending one ping"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: commute
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.name commute-bot
          git config --global user.email commute-bot@users.noreply.github.com
          python commute.py --watch
        env:
          RMV_KEY: ${{ secrets.RMV_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME_ADDR: ${{ secrets.HOME_ADDR }}
          WORK_ADDR: ${{ secrets.WORK_ADDR }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.session }}
