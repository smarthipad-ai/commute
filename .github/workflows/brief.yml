name: brief
on:
  schedule:
    # Berlin time, each pair covers summer and winter (UTC+2 / UTC+1); brief.py waits for the exact minute
    - cron: "15 4 * * 1-5"    # morning brief, sent 06:45
    - cron: "15 5 * * 1-5"
    - cron: "30 17 * * 0-4"   # evening heads-up for tomorrow, sent 20:00 when there's something to say
    - cron: "30 18 * * 0-4"
  workflow_dispatch:
    inputs:
      evening:
        description: "Send the evening heads-up instead"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: brief
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q icalendar==6.3.2 recurring-ical-events==3.8.0
          python brief.py ${{ inputs.evening && '--evening' || '' }}
        env:
          RMV_KEY: ${{ secrets.RMV_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME_ADDR: ${{ secrets.HOME_ADDR }}
          WORK_ADDR: ${{ secrets.WORK_ADDR }}
          REMINDERS: ${{ secrets.REMINDERS }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          FES_ICS: ${{ secrets.FES_ICS }}
          FX: ${{ vars.FX || 'INR' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          SCHEDULE: ${{ github.event.schedule }}
