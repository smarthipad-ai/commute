name: brief
on:
  schedule:
    # Fallback only: GitHub's scheduler has been starting these 4-5 hours late. The real trigger is the external timer,
    # which calls tick.yml at 06:15, 14:15 and 19:15 Berlin time. brief.py decides from the actual time and skips duplicates.
    - cron: "15 4 * * 1-5"
    - cron: "15 17 * * 0-4"
  workflow_dispatch:
    inputs:
      evening:
        description: "Send the evening heads-up now"
        type: boolean
        default: false
      auto:
        description: "Behave like a scheduled run (used by the timer): wait for 06:45/20:00, skip if already sent"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: brief
jobs:
  brief:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to 26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          git config --global user.name commute-bot
          git config --global user.email commute-bot@users.noreply.github.com
          pip install -q icalendar==6.3.2 recurring-ical-events==3.8.0
          python brief.py ${{ inputs.evening && '--evening' || '' }}
        env:
          RMV_KEY: ${{ secrets.RMV_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME_ADDR: ${{ secrets.HOME_ADDR }}
          WORK_ADDR: ${{ secrets.WORK_ADDR }}
          REMINDERS: ${{ secrets.REMINDERS }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          FES_ICS: ${{ secrets.FES_ICS }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FX: ${{ vars.FX || 'INR' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.auto }}
