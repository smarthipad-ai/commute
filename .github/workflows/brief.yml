name: brief
on:
  schedule:
    # Berlin is UTC+2 in summer, UTC+1 in winter. GitHub's scheduler is best-effort and often hours late, so there are several
    # triggers; brief.py decides from the actual time and stands down if the ping was already sent.
    - cron: "15 4 * * 1-5"    # morning brief: 06:15 / 05:15 Berlin, sent at 06:45
    - cron: "45 4 * * 1-5"
    - cron: "15 5 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "15 17 * * 0-4"   # evening heads-up: 19:15 / 18:15 Berlin, sent at 20:00
    - cron: "45 17 * * 0-4"
    - cron: "15 18 * * 0-4"
    - cron: "45 18 * * 0-4"
  workflow_dispatch:
    inputs:
      evening:
        description: "Send the evening heads-up instead"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: brief
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.name commute-bot
          git config --global user.email commute-bot@users.noreply.github.com
          pip install -q icalendar==6.3.2 recurring-ical-events==3.8.0
          python brief.py ${{ inputs.evening && '--evening' || '' }}
        env:
          RMV_KEY: ${{ secrets.RMV_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME_ADDR: ${{ secrets.HOME_ADDR }}
          WORK_ADDR: ${{ secrets.WORK_ADDR }}
          REMINDERS: ${{ secrets.REMINDERS }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          FES_ICS: ${{ secrets.FES_ICS }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          FX: ${{ vars.FX || 'INR' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
